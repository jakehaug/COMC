[project]
name = "comc-agent"
version = "0.1.0"
description = "Autonomous trading agent for COMC sports cards"
requires-python = ">=3.11"
dependencies = [
    # patchright is a drop-in Playwright fork with stealth patches baked in,
    # specifically targeted at Cloudflare-style bot detection.
    "patchright>=1.48",
    "playwright>=1.44",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "apscheduler>=3.10",
    "rich>=13.7",
    "typer>=0.12",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
comc-agent = "comc_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comc_agent"]
